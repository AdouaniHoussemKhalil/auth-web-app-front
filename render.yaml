# Blueprint Render : le dashboard est un site statique (HTML/JS issus de `npm run build`), construit depuis
# la branche master. Les variables VITE_* sont lues au BUILD : après une modification, redéployer.
services:
  - type: web
    name: auth-console
    runtime: static
    branch: master
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Pas de hook Git à installer pendant le build.
      - key: HUSKY
        value: "0"
      # URL publique de l'API (https://….onrender.com), sans slash final.
      - key: VITE_API_BASE_URL
        sync: false
      # Client ID OAuth Google (public) ; vide : pas de bouton « Continuer avec Google ».
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    headers:
      # Le dashboard ne doit pas pouvoir être affiché dans une iframe (clickjacking).
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Fichiers de build nommés par leur contenu : cache long ; index.html toujours revalidé.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
